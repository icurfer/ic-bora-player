name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install validation and build dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y python3-pytest python3-gi python3-gi-cairo python3-pil gir1.2-gtk-4.0 gir1.2-adw-1 python3-mpv ffmpeg xvfb xauth libxtst6 fakeroot
      - name: Verify release input
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/version_policy.py --release-tag "$RELEASE_TAG"
          node harness/bin/praxis.mjs task init ci-verification --title "Verify current commit" --size small
          node harness/bin/praxis.mjs task check ci-verification
          BORA_TEST_PYTHON=/usr/bin/python3 node harness/bin/praxis.mjs task validate ci-verification
          node harness/bin/praxis.mjs task status ci-verification
      - name: Report test failures
        if: failure()
        run: |
          /usr/bin/python3 - <<'PYTEST'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ['RUNNER_TEMP']) / 'tests.xml'
          if report.exists():
              for case in ET.parse(report).iter('testcase'):
                  for kind in ('failure', 'error'):
                      for failure in case.findall(kind):
                          message = (case.get('name', '') + ': ' + (failure.text or ''))[-5000:]
                          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::error::' + message)
          PYTEST
      - name: Verify terminal keyboard flow on isolated display
        run: xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo BORA_TEST_ISOLATED_X11=1 /usr/bin/python3 .claude/skills/verify-app/scenarios/17-terminal-choice.py
      - name: Build and verify package
        run: |
          bash scripts/build-deb.sh --release
          expected="$(python3 scripts/version_policy.py --debian)"
          test "$(dpkg-deb -f "dist/bora_${expected}_all.deb" Version)" = "$expected"
          sudo apt-get install -y ./dist/*.deb
          actual="$(/usr/bin/python3 -c 'import bora; print(bora.__version__)')"
          test "$(printf '%s' "$actual" | tr '-' '~')" = "$expected"
          (cd dist && sha256sum *.deb > SHA256SUMS)
      - name: Create draft with assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--draft --verify-tag --title "Bora $RELEASE_TAG" --notes-file "docs/releases/$(cat version).md")
          if [[ "$(cat version)" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.deb dist/SHA256SUMS "${args[@]}"
