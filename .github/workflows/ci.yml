name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-gi python3-gi-cairo python3-pil gir1.2-gtk-4.0 gir1.2-adw-1 python3-mpv ffmpeg xvfb xauth fakeroot
      - name: Policy and unit tests
        run: |
          bash scripts/check-conventions.sh --all
          xvfb-run -a /usr/bin/python3 -m pytest -q --junitxml="$RUNNER_TEMP/tests.xml"
      - name: Report test failures
        if: failure()
        run: |
          /usr/bin/python3 - <<'PYTEST'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ['RUNNER_TEMP']) / 'tests.xml'
          if report.exists():
              for case in ET.parse(report).iter('testcase'):
                  for kind in ('failure', 'error'):
                      for failure in case.findall(kind):
                          message = (case.get('name', '') + ': ' + (failure.text or ''))[-5000:]
                          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::error::' + message)
          PYTEST
      - name: Build and check development package
        run: |
          expected="$(python3 scripts/version_policy.py --development --debian)"
          bash scripts/build-deb.sh
          test "$(dpkg-deb -f "dist/bora_${expected}_all.deb" Version)" = "$expected"
          sudo apt-get install -y ./dist/*.deb
          actual="$(/usr/bin/python3 -c 'import bora; print(bora.__version__)')"
          test "$(printf '%s' "$actual" | tr '-' '~')" = "$expected"
          (cd dist && sha256sum *.deb > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: development-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
