name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-gi python3-gi-cairo python3-pil gir1.2-gtk-4.0 gir1.2-adw-1 python3-mpv ffmpeg xvfb xauth fakeroot
      - name: Policy and unit tests
        run: |
          bash scripts/check-conventions.sh --all
          xvfb-run -a /usr/bin/python3 -m pytest -q
      - name: Build development package
        run: bash scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: development-deb
          path: dist/*.deb
          retention-days: 14
