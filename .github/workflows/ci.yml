name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y python3-pytest python3-gi python3-gi-cairo python3-pil gir1.2-gtk-4.0 gir1.2-adw-1 python3-mpv ffmpeg xvfb xauth libxtst6 fakeroot openbox bubblewrap libegl-mesa0
      - name: Policy and unit tests
        run: |
          bash scripts/check-index-clean.sh
          bash scripts/check-conventions.sh --all
          python3 scripts/check-test-guard.py
          BORA_TEST_PYTHON=/usr/bin/python3 bash scripts/check-python-tests.sh
      - name: Report test failures
        if: failure()
        run: |
          /usr/bin/python3 - <<'PYTEST'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ['RUNNER_TEMP']) / 'tests.xml'
          if report.exists():
              for case in ET.parse(report).iter('testcase'):
                  for kind in ('failure', 'error'):
                      for failure in case.findall(kind):
                          message = (case.get('name', '') + ': ' + (failure.text or ''))[-5000:]
                          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::error::' + message)
          PYTEST
      - name: Verify terminal keyboard flow on isolated display
        run: bash scripts/run-tests-bounded.sh xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo BORA_TEST_ISOLATED_X11=1 /usr/bin/python3 .claude/skills/verify-app/scenarios/17-terminal-choice.py
      - name: Verify study agent on isolated display
        run: bash scripts/run-tests-bounded.sh xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo BORA_TEST_ISOLATED_X11=1 /usr/bin/python3 .claude/skills/verify-app/scenarios/19-study-agent.py
      - name: Verify unified menus with a window manager
        id: menus
        run: bash scripts/run-tests-bounded.sh xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo BORA_TEST_ISOLATED_X11=1 BORA_REVIEW_SHOTS="$RUNNER_TEMP/menu-screens" /usr/bin/python3 .claude/skills/verify-app/scenarios/20-unified-menu.py 2>&1 | tee "$RUNNER_TEMP/menu-verification.log"
      - name: Preserve menu failure evidence
        if: failure() && steps.menus.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: menu-verification-diagnostics
          path: |
            ${{ runner.temp }}/menu-verification.log
            ${{ runner.temp }}/menu-screens/
          retention-days: 7
      - name: Build and check development package
        run: |
          expected="$(python3 scripts/version_policy.py --development --debian)"
          bash scripts/build-deb.sh
          test "$(dpkg-deb -f "dist/bora_${expected}_all.deb" Version)" = "$expected"
          sudo apt-get install -y ./dist/*.deb
          actual="$(/usr/bin/python3 -c 'import bora; print(bora.__version__)')"
          test "$(printf '%s' "$actual" | tr '-' '~')" = "$expected"
          (cd dist && sha256sum *.deb > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: development-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
